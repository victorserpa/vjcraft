[package]
name = "vjc-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vjcraft"
path = "src/main.rs"

[dependencies]
vjc-model = { path = "../vjc-model" }
vjc-core = { path = "../vjc-core" }
vjc-io = { path = "../vjc-io" }
vjc-avc = { path = "../vjc-avc" }
eframe = "0.36.2"
rfd = "0.17.2"
vjc-media = { path = "../vjc-media" }
bytemuck = { version = "1", features = ["derive"] }
uuid.workspace = true
pollster = "1"
vjc-fx = { path = "../vjc-fx" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[dev-dependencies]
