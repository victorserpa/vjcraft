[package]
name = "vjc-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vjcraft"
path = "src/main.rs"

[dependencies]
vjc-model = { path = "../vjc-model" }
vjc-core = { path = "../vjc-core" }
vjc-io = { path = "../vjc-io" }
vjc-avc = { path = "../vjc-avc" }
eframe = "0.36.2"
rfd = "0.17.2"
vjc-media = { path = "../vjc-media" }
bytemuck = { version = "1", features = ["derive"] }
uuid.workspace = true
serde_json.workspace = true
pollster = "1"
directories = "6"
vjc-fx = { path = "../vjc-fx" }
vjc-ml = { path = "../vjc-ml" }
midir = "0.11.1"
vjc-net = { path = "../vjc-net", default-features = false }
rusty_link = { version = "0.4.9", optional = true }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tiny_http = { version = "0.12", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu"] }

[features]
default = ["link", "syphon", "ndi"]
link = ["dep:rusty_link"]
# Syphon in/out (macOS only; compiled from vendor/syphon).
syphon = ["vjc-net/syphon"]
# NDI in/out; needs libndi at runtime, otherwise reported as unavailable.
ndi = ["vjc-net/ndi"]
