[workspace]
resolver = "2"
members = ["crates/vjc-model", "crates/vjc-core", "crates/vjc-io", "crates/vjc-avc", "crates/vjc-media", "crates/vjc-fx", "crates/vjc-app"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
